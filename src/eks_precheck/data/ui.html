<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKS 업그레이드 사전 점검</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2127; --muted: #5f6b7a; --border: #dde1e6;
    --accent: #2f6fde; --accent-text: #ffffff; --accent-soft: #e8f0fd; --danger: #c62828; --warn: #c58a00;
    --warn-bg: #fff6e0; --warn-border: #f0c36d;
    --code-bg: #f0f2f5; --quote-bg: #f3f6fb; --quote-border: #9db6e8; --row-hover: #f5f8fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e3e6ea; --muted: #98a2b0; --border: #333a44;
      --accent: #5b8ff0; --accent-text: #0e1116; --accent-soft: #22324f; --danger: #ef6b6b; --warn: #e3b341;
      --warn-bg: #3a3020; --warn-border: #7a6230;
      --code-bg: #262b33; --quote-bg: #212835; --quote-border: #4d6aa3; --row-hover: #232a35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

  /* header + tabs */
  header { display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--border);
           background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; padding: 12px 0; white-space: nowrap; }
  header .ver { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; align-self: stretch; }
  nav.tabs a { display: flex; align-items: center; padding: 0 14px; color: var(--muted); text-decoration: none;
               border-bottom: 2px solid transparent; font-weight: 500; }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs a.disabled { pointer-events: none; opacity: .45; }
  header .spacer { flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: #2e7d32; border-color: #2e7d32; }

  .view { padding: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  .narrow { max-width: 820px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }

  /* form */
  input[type=text], select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                             background: var(--bg); color: var(--text); font: inherit; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.invalid, select.invalid { border-color: var(--danger); }
  .ver-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; max-width: 520px; }
  .ver-pair label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .arrow { padding-top: 16px; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
  .item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; align-content: start; }
  .line { display: grid; gap: 6px; align-items: end; }
  .addon .l1 { grid-template-columns: 1.5fr 1fr 28px; }
  .ng .l1 { grid-template-columns: 1fr 1fr 28px; }
  .line.two { grid-template-columns: 1fr 1fr; }
  .line > * { min-width: 0; }
  label.f span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  select:disabled { opacity: .6; }
  .combo { position: relative; }
  .combo input { padding-right: 30px; }
  .combo-btn { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 28px; padding: 0; border: none; border-radius: 0 6px 6px 0;
               background: transparent; color: var(--muted); font-size: 13px; }
  .combo-btn:hover { background: var(--row-hover); color: var(--text); }
  .combo-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); max-height: 260px; overflow-y: auto;
                margin: 0; padding: 4px 0; list-style: none; background: var(--panel); border: 1px solid var(--border);
                border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
  .combo-list li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .combo-list li:hover, .combo-list li.active { background: var(--row-hover); }
  .combo-list li.sel { color: var(--accent); font-weight: 600; }
  .combo-list li small { color: var(--muted); font-weight: 400; }
  .combo-list li.combo-msg { cursor: default; color: var(--muted); font-size: 12px; }
  .combo-list li.src { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button:hover { background: var(--row-hover); }
  button.icon { padding: 0; width: 28px; height: 30px; color: var(--muted); }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 0; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .6; cursor: progress; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
  .actions .primary { padding: 10px 28px; }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .checks label { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .error { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px; padding: 8px 10px; margin-top: 12px;
           white-space: pre-wrap; overflow-wrap: anywhere; }
  #progress { margin-top: 16px; }
  #log { font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--code-bg); border-radius: 6px; padding: 10px;
         max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* report view */
  .report-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
  aside.toc { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow-y: auto; padding: 10px 8px; }
  .toc a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 13.5px; }
  .toc a:hover { background: var(--row-hover); }
  .toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .toc a.sub { padding-left: 24px; font-size: 13px; }
  .toc a .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc a small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc .grp { font-size: 11px; color: var(--muted); padding: 10px 10px 2px; text-transform: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.crit { background: var(--danger); }
  .dot.warn { background: var(--warn); }
  .dot.none { background: transparent; }
  .report-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .report-head .title { font-weight: 600; font-size: 15px; }
  .report-head .file { color: var(--muted); font-size: 12px; }
  .report-head .spacer { flex: 1; }
  .index-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin: 12px 0; }
  .index-cards a { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
                   color: var(--text); text-decoration: none; }
  .index-cards a:hover { border-color: var(--accent); }
  .index-cards a .dot { margin-top: 6px; }
  .index-cards small { display: block; color: var(--muted); font-size: 12px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--border); }
  .pager a { color: var(--accent); text-decoration: none; font-size: 13px; }
  @media (max-width: 900px) {
    .report-layout { grid-template-columns: 1fr; }
    aside.toc { position: static; max-height: none; }
  }

  /* history */
  table.list { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.list th, table.list td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  table.list tr.click { cursor: pointer; }
  table.list tr.click:hover td { background: var(--row-hover); }
  .empty { color: var(--muted); text-align: center; padding: 50px 20px; }

  /* report body */
  .report-body { overflow-wrap: anywhere; }
  .report-body h1 { font-size: 20px; margin-top: 0; }
  .report-body h2 { font-size: 18px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .report-body h3 { font-size: 16px; margin: 0 0 10px; }
  .report-body .page > h3:not(:first-child), .report-body .page > h2 + h3 { margin-top: 22px; }
  .report-body h4 { font-size: 14px; margin: 18px 0 6px; }
  .report-body ul { padding-left: 22px; margin: 6px 0; }
  .report-body li { margin: 3px 0; }
  .report-body li.task { list-style: none; margin-left: -20px; }
  .report-body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .report-body pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .report-body pre code { background: none; padding: 0; }
  .report-body blockquote { margin: 10px 0; padding: 8px 12px; background: var(--quote-bg); border-left: 4px solid var(--quote-border); border-radius: 4px; }
  .report-body a { color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  .report-body table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .report-body th, .report-body td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
  .report-body th { background: var(--code-bg); }
  .report-body tr:hover td { background: var(--row-hover); }

  /* troubleshooting */
  #ts-search { margin-bottom: 8px; }
  #ts-nav a .lbl { white-space: normal; }
  .ts .muted, .ts .goal { color: var(--muted); margin: 4px 0 12px; }
  .ts .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 18px; }
  .ts .flow a { border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; text-decoration: none; color: var(--text); font-size: 13px; }
  .ts .flow a:hover { border-color: var(--accent); color: var(--accent); }
  .ts .flow span { color: var(--muted); }
  .ts .phase { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .ts .phase h3 { margin: 0; }
  .ts .phase h4, .ts > h4 { margin: 14px 0 6px; font-size: 13.5px; }
  .ts .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ts .chips a { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 3px 10px; font-size: 12.5px; text-decoration: none; }
  .ts .rollback { margin: 0; }
  .ts .crumb { font-size: 12.5px; margin-bottom: 4px; }
  .cmds { display: grid; gap: 4px; min-width: 0; }
  .cmd { display: flex; align-items: flex-start; gap: 6px; background: var(--code-bg); border-radius: 6px; padding: 6px 6px 6px 10px; }
  .cmd code { flex: 1; min-width: 0; background: none !important; padding: 0 !important; white-space: pre-wrap; overflow-wrap: anywhere;
              font: 12.5px/1.5 ui-monospace, Consolas, monospace; }
  .cmd .copy { padding: 1px 8px; font-size: 11.5px; flex: none; }
  .cause { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 8px 0; display: grid; gap: 8px; }
  .cause-title { font-weight: 600; }
  .cause .row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: start; }
  .cause .row b { font-size: 12px; color: var(--muted); padding-top: 3px; }
  @media print {
    header, aside.toc, .report-head, .pager, .index-cards { display: none !important; }
    .view { padding: 0; }
    .report-layout { display: block; }
    .panel { border: none; padding: 0; }
    .report-body .page { display: block !important; break-inside: auto; margin-bottom: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>EKS 업그레이드 사전 점검</h1>
  <span class="ver" id="ver"></span>
  <nav class="tabs" aria-label="화면">
    <a href="#/input" data-tab="input">입력</a>
    <a href="#/report" data-tab="report" id="tab-report">리포트</a>
    <a href="#/history" data-tab="history">기록</a>
    <a href="#/troubleshoot" data-tab="troubleshoot">트러블슈팅</a>
  </nav>
  <span class="spacer"></span>
  <span class="badge" id="token-badge" title="GitHub API 호출 한도">GitHub 토큰 확인 중</span>
</header>

<!-- 입력 -->
<section class="view" id="view-input" hidden>
  <form id="form" class="panel narrow" autocomplete="off" novalidate>
    <h2>1. 클러스터 버전</h2>
    <div class="ver-pair">
      <div><label for="cur">현재</label><select id="cur"></select></div>
      <div class="arrow">→</div>
      <div><label for="tgt">목표</label><select id="tgt"></select></div>
    </div>

    <h2>2. 사용 중인 add-on / 컨트롤러</h2>
    <div id="addons" class="cards"></div>
    <button type="button" class="link" id="add-addon">+ add-on 추가</button>

    <h2>3. 노드그룹 (선택)</h2>
    <div id="nodegroups" class="cards"></div>
    <button type="button" class="link" id="add-ng">+ 노드그룹 추가</button>

    <details id="opts">
      <summary>옵션</summary>
      <div class="checks">
        <label><input type="checkbox" id="opt-issues" checked> GitHub 관련 이슈 검색 (느릴 수 있음)</label>
        <label><input type="checkbox" id="opt-aws" checked> AWS CLI 로 EKS 지원 버전 / 권장 AMI 조회 (읽기 전용)</label>
        <label><input type="checkbox" id="opt-cache" checked> 캐시 사용 (6시간)</label>
      </div>
      <div class="ver-pair" style="grid-template-columns: 1fr 1fr;">
        <div><label for="aws-profile">AWS profile</label><input type="text" id="aws-profile" placeholder="기본값"></div>
        <div><label for="aws-region">AWS region (AMI 조회 리전)</label><input type="text" id="aws-region" placeholder="기본값"></div>
      </div>
    </details>

    <div class="actions">
      <button type="submit" class="primary" id="run">리포트 생성</button>
    </div>
    <div id="form-error" class="error" hidden></div>
    <div id="progress" hidden>
      <div><span class="spinner" id="spinner"></span><span id="progress-text">리포트 생성 중… (수십 초 걸릴 수 있음)</span></div>
      <div id="log"></div>
    </div>
  </form>
</section>

<!-- 리포트 -->
<section class="view" id="view-report" hidden>
  <div id="report-empty" class="panel narrow empty" hidden>
    아직 생성한 리포트가 없습니다.<br><br><button type="button" class="primary" onclick="location.hash='#/input'">입력하러 가기</button>
  </div>
  <div class="report-layout" id="report-layout" hidden>
    <aside class="panel toc" id="toc" aria-label="리포트 항목"></aside>
    <div class="panel">
      <div class="report-head">
        <span class="title" id="report-title"></span>
        <span class="file" id="report-file"></span>
        <span class="spacer"></span>
        <button type="button" id="download">Markdown 다운로드</button>
        <button type="button" id="print">전체 인쇄 / PDF</button>
      </div>
      <article class="report-body" id="report"></article>
    </div>
  </div>
</section>

<!-- 트러블슈팅 -->
<section class="view" id="view-troubleshoot" hidden>
  <div class="report-layout">
    <aside class="panel toc" aria-label="트러블슈팅 항목">
      <input type="text" id="ts-search" placeholder="증상 검색 (예: ImagePull, OOM, NotReady)">
      <nav id="ts-nav"></nav>
    </aside>
    <div class="panel"><article class="report-body ts" id="ts-body"></article></div>
  </div>
</section>

<!-- 기록 -->
<section class="view" id="view-history" hidden>
  <div class="panel narrow">
    <h2>지난 리포트</h2>
    <div id="history-list"></div>
  </div>
</section>

<script>
(() => {
  const STORE_KEY = "eks-precheck:input";
  const CUSTOM = "__custom__";
  const $ = (id) => document.getElementById(id);
  let components = {};

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) node.setAttribute(k, v);
    }
    for (const c of children) node.append(c);
    return node;
  };

  const input = (cls, value, placeholder, list) =>
    el("input", { type: "text", class: cls, value: value ?? "", placeholder, list });
  const field = (label, control) => el("label", { class: "f" }, el("span", {}, label), control);

  const STATUS_LABEL = { standard: "standard", extended: "extended 지원", ended: "지원 종료", unverified: "지원 확인 필요" };
  const INSTALL_LABEL = { "eks-addon": "EKS 관리형 add-on", helm: "Helm / 직접 설치" };
  let k8sVersions = [];      // [{minor, status}] 최신순
  let pendingCluster = null; // 버전 목록 로딩 전에 채울 값
  let amiTypes = [];

  const minorNum = (m) => { const [a, b] = String(m).split("."); return Number(a) * 1000 + Number(b); };

  function fillSelect(sel, items, value, emptyLabel) {
    sel.replaceChildren(el("option", { value: "" }, emptyLabel));
    for (const it of items) sel.append(el("option", { value: it.minor }, `${it.minor}  (${STATUS_LABEL[it.status] || it.status})`));
    if (value && !items.some((it) => it.minor === value)) sel.append(el("option", { value }, `${value}  (목록에 없음)`));
    sel.value = value || "";
  }

  function refreshClusterSelects(cur, tgt) {
    cur = cur ?? $("cur").value; tgt = tgt ?? $("tgt").value;
    fillSelect($("cur"), k8sVersions, cur, "현재 버전 선택");
    const higher = k8sVersions.filter((v) => !cur || minorNum(v.minor) > minorNum(cur)).filter((v) => v.status !== "ended");
    if (tgt && cur && minorNum(tgt) <= minorNum(cur)) tgt = "";
    if (!tgt && cur) tgt = higher.length ? higher[higher.length - 1].minor : "";  // 기본: 바로 다음 버전
    fillSelect($("tgt"), higher, tgt, "목표 버전 선택");
    for (const s of document.querySelectorAll("#nodegroups .n-ver")) fillSelect(s, k8sVersions, s.value || cur, "버전");
  }

  async function loadVersions() {
    for (const id of ["cur", "tgt"]) if (!k8sVersions.length) $(id).replaceChildren(el("option", { value: "" }, "버전 목록 불러오는 중…"));
    const qs = new URLSearchParams({ profile: $("aws-profile").value.trim(), region: $("aws-region").value.trim() });
    try {
      const res = await fetch(`/api/versions?${qs}`);
      const data = await res.json();
      k8sVersions = data.versions || [];
    } catch (e) {
      k8sVersions = [];
    }
    const p = pendingCluster; pendingCluster = null;
    refreshClusterSelects(p?.current, p?.target);
  }

  // ---- 콤보박스: 직접 입력 + ▾ 로 전체 목록 (입력값과 무관하게 모두 표시) ----
  function combo(cls, value, placeholder, loader) {
    const inp = input(cls, value, placeholder);
    inp.setAttribute("role", "combobox");
    inp.setAttribute("aria-autocomplete", "list");
    const list = el("ul", { class: "combo-list", role: "listbox", hidden: "" });
    const btn = el("button", { type: "button", class: "combo-btn", tabindex: "-1", "aria-label": "목록 열기", title: "목록 열기" }, "▾");
    const wrap = el("div", { class: "combo" }, inp, btn, list);
    let result = null, loadedKey = null, active = -1, filtered = false;

    async function ensure() {
      const key = loader.key();
      if (result && loadedKey === key) return;
      loadedKey = key; result = null;
      render("불러오는 중…");
      const r = await loader.load();
      if (loadedKey === key) result = r;
    }
    function render(msg, filter = "") {
      list.replaceChildren();
      active = -1;
      if (msg) { list.append(el("li", { class: "combo-msg" }, msg)); return; }
      const f = filter.toLowerCase();
      const vs = (result?.versions || []).filter((v) => !f || v.toLowerCase().includes(f));
      const cur = inp.value.trim();
      for (const v of vs) {
        list.append(el("li", { role: "option", class: v === cur ? "sel" : "", "data-v": v,
                               onmousedown: (e) => { e.preventDefault(); pick(v); } },
          el("span", {}, v), ...(v === result.default ? [el("small", {}, "EKS 기본")] : [])));
      }
      if (!vs.length) {
        list.append(el("li", { class: "combo-msg" }, result?.error ? `목록을 불러오지 못했습니다: ${result.error}`
          : f ? `'${filter}' 와 일치하는 버전 없음 — 그대로 입력해도 됩니다` : "목록 없음 — 직접 입력하세요"));
      }
      if (result?.source) list.append(el("li", { class: "combo-msg src" }, `출처: ${result.source}`));
      list.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
    }
    async function open(filter = "") {
      list.hidden = false;
      filtered = !!filter;
      await ensure();
      if (!list.hidden) render(null, filter);
    }
    function close() { list.hidden = true; active = -1; }
    function pick(v) { inp.value = v; close(); inp.dispatchEvent(new Event("change", { bubbles: true })); }

    btn.addEventListener("mousedown", (e) => e.preventDefault());  // 입력 칸 포커스 유지
    list.addEventListener("mousedown", (e) => e.preventDefault());
    // ▾: 닫혀 있거나 입력값으로 걸러진 목록이면 전체 목록을 보여 주고, 전체 목록이 열려 있을 때만 닫는다
    btn.addEventListener("click", () => { if (list.hidden || filtered) { inp.focus(); open(); } else close(); });
    inp.addEventListener("input", () => open(inp.value.trim()));
    inp.addEventListener("blur", () => setTimeout(close, 120));
    inp.addEventListener("keydown", (e) => {
      const opts = [...list.querySelectorAll('li[role="option"]')];
      if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) { open(); return; } active = Math.min(active + 1, opts.length - 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); }
      else if (e.key === "Enter" && !list.hidden && opts[active]) { e.preventDefault(); pick(opts[active].dataset.v); return; }
      else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); close(); return; }
      else return;
      opts.forEach((o, i) => o.classList.toggle("active", i === active));
      opts[active]?.scrollIntoView({ block: "nearest" });
    });
    wrap.input = inp;
    return wrap;
  }

  async function fetchVersions(name, install, k8s) {
    if (!name) return { versions: [], error: "구성요소를 먼저 선택하세요" };
    if (name === CUSTOM) return { versions: [] };
    const qs = new URLSearchParams({ name, install, k8s: k8s || "",
                                     profile: $("aws-profile").value.trim(), region: $("aws-region").value.trim() });
    try { return await (await fetch(`/api/component-versions?${qs}`)).json(); }
    catch (e) { return { versions: [], error: String(e) }; }
  }

  // ---- add-on cards ----
  function addonRow(data = {}) {
    const known = data.name && components[data.name];
    const sel = el("select", { class: "a-name", "aria-label": "구성요소" });
    sel.append(el("option", { value: "" }, "구성요소 선택…"));
    const gEks = el("optgroup", { label: "EKS 관리형 add-on 으로도 설치 가능" });
    const gHelm = el("optgroup", { label: "Helm / 직접 설치" });
    for (const [name, c] of Object.entries(components)) (c.eks_addon ? gEks : gHelm).append(el("option", { value: name }, c.title || name));
    sel.append(gEks, gHelm, el("option", { value: CUSTOM }, "기타 (GitHub 레포 직접 입력)"));
    sel.value = data.name ? (known ? data.name : CUSTOM) : "";

    const inst = el("select", { class: "a-install", "aria-label": "설치 방식" });
    const custom = el("div", { class: "line two" },
      field("이름", input("a-custom-name", known ? "" : data.name, "예: my-operator")),
      field("GitHub 레포", input("a-repo", data.repo, "owner/name")));
    const loaderFor = (k8sOf, onLoad) => ({
      key: () => `${sel.value}|${inst.value}|${k8sOf()}`,
      load: async () => { const r = await fetchVersions(sel.value, inst.value, k8sOf()); onLoad?.(r); return r; },
    });
    const curBox = combo("a-cur", data.current, "입력하거나 ▾ 에서 선택", loaderFor(() => $("cur").value));
    const tgtBox = combo("a-tgt", data.target, "비우면 최신 / 기본 버전", loaderFor(() => $("tgt").value, (r) => {
      tgtBox.input.placeholder = r.default ? `비우면 최신 (EKS 기본: ${r.default})` : "비우면 최신 / 기본 버전";
    }));

    function syncInstall(keep) {
      const name = sel.value, c = components[name];
      const opts = c?.eks_addon ? ["eks-addon", "helm"] : ["helm"];
      const prev = keep ?? inst.value;
      inst.replaceChildren(...opts.map((o) => el("option", { value: o }, INSTALL_LABEL[o])));
      inst.value = opts.includes(prev) ? prev : opts[0];
      inst.disabled = !name;
      custom.hidden = name !== CUSTOM;
      curBox.input.title = !name ? "" : inst.value === "helm"
        ? "helm list -A 의 APP VERSION"
        : `aws eks describe-addon --cluster-name <이름> --addon-name ${c?.eks_addon || name} 의 addonVersion`;
    }
    sel.addEventListener("change", () => syncInstall());
    inst.addEventListener("change", () => syncInstall(inst.value));

    const row = el("div", { class: "item addon" },
      el("div", { class: "line l1" }, field("구성요소", sel), field("설치 방식", inst),
        el("button", { type: "button", class: "icon", title: "삭제", onclick: () => row.remove() }, "✕")),
      custom,
      el("div", { class: "line two" }, field("현재 버전", curBox), field("목표 버전 (선택)", tgtBox)));
    $("addons").append(row);
    syncInstall(data.install);
  }

  // ---- node group cards ----
  function ngRow(data = {}) {
    const ver = el("select", { class: "n-ver", "aria-label": "노드그룹 버전" });
    fillSelect(ver, k8sVersions, data.version || $("cur").value, "버전");
    const ami = el("select", { class: "n-ami", "aria-label": "AMI 타입" });
    ami.append(el("option", { value: "" }, "AMI 타입 선택…"));
    for (const t of amiTypes) ami.append(el("option", { value: t }, t));

    ami.value = data.ami_type || "";
    const row = el("div", { class: "item ng" },
      el("div", { class: "line l1" }, field("이름", input("n-name", data.name, "app")), field("버전", ver),

      el("div", { class: "line two" }, field("AMI 타입", ami),

  // ---- form <-> data ----
  function collect() {
    const data = { cluster: { current: $("cur").value, target: $("tgt").value }, addons: {}, nodegroups: [] };
    for (const row of $("addons").children) {
      let name = row.querySelector(".a-name").value;
      const entry = { current: row.querySelector(".a-cur").value.trim(), target: row.querySelector(".a-tgt").value.trim(),
                      install: row.querySelector(".a-install").value };
      if (name === CUSTOM) {
        name = row.querySelector(".a-custom-name").value.trim();
        entry.repo = row.querySelector(".a-repo").value.trim();
      }
      if (name) data.addons[name] = entry;
    }
    for (const row of $("nodegroups").children) {
      const ng = { name: row.querySelector(".n-name").value.trim(), version: row.querySelector(".n-ver").value,
                   ami_type: row.querySelector(".n-ami").value, ami_id: row.querySelector(".n-ami-id").value.trim() };
      if (ng.name || ng.ami_type || ng.ami_id) data.nodegroups.push(ng);
    }
    const profile = $("aws-profile").value.trim(), region = $("aws-region").value.trim();
    if (profile || region) data.aws = { profile, region };
    data.options = { no_issues: !$("opt-issues").checked, no_aws: !$("opt-aws").checked, no_cache: !$("opt-cache").checked };
    return data;
  }

  function fill(data) {
    $("aws-profile").value = data?.aws?.profile ?? "";
    $("aws-region").value = data?.aws?.region ?? "";
    if (k8sVersions.length) refreshClusterSelects(data?.cluster?.current ?? "", data?.cluster?.target ?? "");
    else pendingCluster = data?.cluster ?? null;
    $("addons").replaceChildren();
    $("nodegroups").replaceChildren();
    const addons = data?.addons ?? {};
    for (const [name, v] of Object.entries(addons)) {
      const entry = (v && typeof v === "object") ? v : { current: v };
      addonRow({ name, current: entry.current, target: entry.target, repo: entry.repo, install: entry.install });
    }
    if (!Object.keys(addons).length) ["vpc-cni", "coredns", "kube-proxy"].forEach((name) => addonRow({ name }));
    for (const ng of data?.nodegroups ?? []) ngRow(ng);
    const o = data?.options ?? {};
    $("opt-issues").checked = !o.no_issues; $("opt-aws").checked = !o.no_aws; $("opt-cache").checked = !o.no_cache;
  }

  function validate(data) {
    const errors = [];
    const cur = $("cur").value, tgt = $("tgt").value;
    $("cur").classList.toggle("invalid", !cur);
    $("tgt").classList.toggle("invalid", !tgt);
    if (!cur || !tgt) errors.push("현재 / 목표 클러스터 버전을 선택하세요.");
    else if (minorNum(tgt) <= minorNum(cur)) errors.push("목표 버전은 현재 버전보다 높아야 합니다.");
    for (const row of $("addons").children) {
      const named = row.querySelector(".a-name").value;
      const c = row.querySelector(".a-cur");
      const bad = named && !c.value.trim();
      c.classList.toggle("invalid", !!bad);
      if (bad) errors.push("add-on 의 현재 버전이 비어 있습니다.");
    }
    for (const row of $("nodegroups").children) {
      const ver = row.querySelector(".n-ver");
      const bad = !ver.value && (row.querySelector(".n-name").value || row.querySelector(".n-ami").value);
      ver.classList.toggle("invalid", !!bad);
      if (bad) errors.push("노드그룹 버전을 선택하세요.");
    }
    return [...new Set(errors)];
  }

  const save = (data) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; } };

  // ===================== 라우팅 =====================
  // #/input · #/report[/<file>[/<page>]] · #/history
  let lastReportName = null;
  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
    const tab = ["input", "report", "history", "troubleshoot"].includes(parts[0]) ? parts[0] : "input";
    for (const a of document.querySelectorAll("nav.tabs a")) a.classList.toggle("active", a.dataset.tab === tab);
    for (const v of ["input", "report", "history", "troubleshoot"]) $(`view-${v}`).hidden = v !== tab;
    if (tab === "report") openReport(parts[1] || lastReportName, parts[2]);
    if (tab === "history") renderHistory();
    if (tab === "troubleshoot") openTroubleshoot(parts[1]);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  const reportHash = (name, page) => `#/report/${encodeURIComponent(name)}` + (page ? `/${encodeURIComponent(page)}` : "");

  // ===================== 리포트 보기 =====================
  const cache = new Map(); // name -> {rep, pages}
  let shown = null;        // 현재 화면의 리포트 이름

  async function fetchReport(name) {
    if (cache.has(name)) return cache.get(name);
    const res = await fetch(`/api/reports/${encodeURIComponent(name)}`);
    if (!res.ok) return null;
    const entry = buildPages(await res.json());
    cache.set(name, entry);
    return entry;
  }

  const SPLIT_SECTION = /변경사항|Add-on|컴포넌트/;

  function severity(nodes, isSummary) {
    if (isSummary) {  // 요약: 건수 표의 숫자로 판단
      const count = (mark) => {
        for (const n of nodes) for (const tr of n.querySelectorAll?.("tr") || []) {
          const td = tr.querySelectorAll("td");
          if (td.length === 2 && td[0].textContent.trim().startsWith(mark)) return Number(td[1].textContent) || 0;
        }
        return 0;
      };
      const blocker = nodes.some((n) => n.tagName === "BLOCKQUOTE" && n.textContent.includes("🔴"));
      return blocker || count("🔴") ? "crit" : count("🟡") ? "warn" : "none";
    }
    // 체크리스트 문구와 표 머리글의 이모지는 위험 항목이 아니므로 제외
    const box = document.createElement("div");
    box.append(...nodes.map((n) => n.cloneNode(true)));
    box.querySelectorAll("li.task, table").forEach((x) => x.remove());
    const text = box.textContent;
    return text.includes("🔴") ? "crit" : text.includes("🟡") ? "warn" : "none";
  }

  function splitTitle(text) {
    // "Kubernetes 1.34 — EKS standard support" / "vpc-cni · EKS 관리형 add-on (aws/...)"
    const t = text.replace(/^\d+\.\s*/, "").trim();
    const m = t.match(/^(.+?)\s+(?:—|·)\s+(.+)$/);
    if (m) return { label: m[1], sub: m[2].replace(/\s*\([\w.-]+\/[\w.-]+\)\s*$/, "") };
    return { label: t.replace(/\s*\([\w.-]+\/[\w.-]+\)\s*$/, ""), sub: "" };
  }

  function buildPages(rep) {
    const src = document.createElement("div");
    src.innerHTML = rep.html; // 서버(md_render)에서 escape 된 HTML
    const title = src.querySelector("h1")?.textContent || rep.name;
    const pages = [];
    const overview = { id: "summary", label: "요약", sub: "", nodes: [], children: [] };
    pages.push(overview);
    let cur = overview, group = null;
    for (const node of [...src.children]) {
      if (node.tagName === "H1") continue;
      if (node.tagName === "H2") {
        const text = node.textContent.trim();
        if (/^요약$/.test(text)) { cur = overview; group = null; continue; }
        const { label, sub } = splitTitle(text);
        const page = { id: node.id || `s${pages.length}`, label, sub, nodes: [node], children: [], split: SPLIT_SECTION.test(text) };
        pages.push(page);
        cur = page; group = page.split ? page : null;
        continue;
      }
      if (node.tagName === "H3" && group) {
        const { label, sub } = splitTitle(node.textContent);
        const page = { id: node.id || `s${pages.length}`, label, sub, nodes: [node], children: [], parent: group };
        group.children.push(page);
        pages.push(page);
        cur = page;
        continue;
      }
      cur.nodes.push(node);
    }
    for (const p of pages) p.sev = severity(p.children.length ? p.children.flatMap((c) => c.nodes) : p.nodes, p === overview);
    return { rep, title, pages };
  }

  function navLink(name, page, cls = "") {
    const a = el("a", { href: reportHash(name, page.id), class: cls, "data-page": page.id },
      el("span", { class: `dot ${page.sev}` }),
      el("span", { class: "lbl" }, page.label, ...(page.sub ? [el("small", {}, page.sub)] : [])));
    a.title = page.sub ? `${page.label} — ${page.sub}` : page.label;
    return a;
  }

  function renderReport(entry) {
    const { rep, title, pages } = entry;
    $("report-title").textContent = title;
    $("report-file").textContent = rep.name;
    const toc = $("toc");
    toc.replaceChildren();
    for (const p of pages.filter((x) => !x.parent)) {
      toc.append(navLink(rep.name, p));
      for (const c of p.children) toc.append(navLink(rep.name, c, "sub"));
    }
    const body = $("report");
    body.replaceChildren();
    for (const p of pages) {
      const div = el("div", { class: "page", "data-page": p.id });
      div.append(...p.nodes.map((n) => n.cloneNode(true)));
      if (p.children.length) {  // 그룹 화면: 하위 항목 카드
        const cards = el("div", { class: "index-cards" });
        for (const c of p.children) {
          cards.append(el("a", { href: reportHash(rep.name, c.id) }, el("span", { class: `dot ${c.sev}` }),
            el("span", {}, c.label, ...(c.sub ? [el("small", {}, c.sub)] : []))));
        }
        div.append(cards);
      }
      body.append(div);
    }
    linkImpactTable(body, rep.name, pages);
  }

  // 요약의 '컴포넌트별 영향도' 표에서 컴포넌트 이름을 해당 화면 링크로
  function linkImpactTable(body, name, pages) {
    const byLabel = new Map(pages.filter((p) => p.parent).map((p) => [p.label, p]));
    for (const td of body.querySelectorAll('.page[data-page="summary"] td:first-child')) {
      const page = byLabel.get(td.textContent.trim());
      if (page) td.replaceChildren(el("a", { href: reportHash(name, page.id) }, td.textContent.trim()));
    }
  }

  function showPage(entry, pageId) {
    const { pages, rep } = entry;
    const page = pages.find((p) => p.id === pageId) || pages[0];
    for (const div of $("report").children) div.hidden = div.dataset.page !== page.id;
    for (const a of $("toc").querySelectorAll("a")) a.classList.toggle("active", a.dataset.page === page.id);
    // 이전 / 다음
    const order = pages.filter((p) => !p.children.length || p.nodes.length > 1);
    const i = order.indexOf(page);
    const div = $("report").querySelector(`.page[data-page="${CSS.escape(page.id)}"]`);
    div.querySelector(".pager")?.remove();
    const pager = el("div", { class: "pager" });
    pager.append(i > 0 ? el("a", { href: reportHash(rep.name, order[i - 1].id) }, `← ${order[i - 1].label}`) : el("span"));
    pager.append(i >= 0 && i < order.length - 1 ? el("a", { href: reportHash(rep.name, order[i + 1].id) }, `${order[i + 1].label} →`) : el("span"));
    div.append(pager);
  }

  async function openReport(name, pageId) {
    if (!name) {
      const list = await reportList();
      name = list[0];
    }
    $("report-empty").hidden = !!name;
    $("report-layout").hidden = !name;
    if (!name) return;
    const entry = await fetchReport(name);
    if (!entry) { $("report-empty").hidden = false; $("report-layout").hidden = true; return; }
    lastReportName = name;
    $("tab-report").href = reportHash(name);
    if (shown !== name) { renderReport(entry); shown = name; }
    showPage(entry, pageId);
  }

  $("download").addEventListener("click", () => {
    const entry = cache.get(shown);
    if (!entry) return;
    const blob = new Blob([entry.rep.markdown], { type: "text/markdown;charset=utf-8" });
    const a = el("a", { href: URL.createObjectURL(blob), download: entry.rep.name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("print").addEventListener("click", () => window.print());

  // ===================== 트러블슈팅 =====================
  let ts = null; // {phases, symptoms}
  const tsHash = (id) => `#/troubleshoot/${encodeURIComponent(id)}`;

  // 텍스트 안의 http(s) 링크만 a 태그로 (나머지는 textContent)
  function linkify(text) {
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const m of String(text).matchAll(/https?:\/\/[^\s)]+/g)) {
      frag.append(text.slice(last, m.index), el("a", { href: m[0], target: "_blank", rel: "noopener noreferrer" }, m[0]));
      last = m.index + m[0].length;
    }
    frag.append(text.slice(last));
    return frag;
  }

  function cmdBlock(cmds) {
    const box = el("div", { class: "cmds" });
    for (const c of cmds || []) {
      const btn = el("button", { type: "button", class: "copy" }, "복사");
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(c); }
        catch (e) {
          const ta = el("textarea", {}); ta.value = c; document.body.append(ta); ta.select();
          document.execCommand("copy"); ta.remove();
        }
        btn.textContent = "복사됨"; setTimeout(() => { btn.textContent = "복사"; }, 1200);
      });
      box.append(el("div", { class: "cmd" }, el("code", {}, c), btn));
    }
    return box;
  }

  const phaseOf = (id) => ts.phases.find((p) => p.id === id);
  const symptomOf = (id) => ts.symptoms.find((s) => s.id === id);
  const searchText = (s) => [s.title, ...(s.signs || []), ...s.causes.flatMap((c) => [c.title, c.signs, c.fix])].join(" ").toLowerCase();

  function renderTsNav(activeId) {
    const q = $("ts-search").value.trim().toLowerCase();
    const nav = $("ts-nav");
    nav.replaceChildren(el("a", { href: tsHash("roadmap"), "data-id": "roadmap" }, el("span", { class: "lbl" }, "업그레이드 로드맵")));
    let shownCount = 0;
    for (const p of ts.phases) {
      const items = ts.symptoms.filter((s) => s.phase === p.id && (!q || searchText(s).includes(q)));
      if (q && !items.length) continue;
      nav.append(el("a", { href: tsHash(`phase-${p.id}`), "data-id": `phase-${p.id}` }, el("span", { class: "lbl" }, p.title)));
      for (const s of items) {
        nav.append(el("a", { href: tsHash(s.id), class: "sub", "data-id": s.id }, el("span", { class: "lbl" }, s.title)));
        shownCount++;
      }
    }
    if (q && !shownCount) nav.append(el("div", { class: "grp" }, "일치하는 증상이 없습니다."));
    for (const a of nav.querySelectorAll("a")) a.classList.toggle("active", a.dataset.id === activeId);
  }

  function phaseCard(p, withSymptoms) {
    const card = el("section", { class: "phase" },
      el("h3", {}, p.title), el("p", { class: "goal" }, p.goal),
      el("h4", {}, "진행 / 확인"), el("ul", {}, ...p.steps.map((x) => el("li", {}, x))));
    if (p.commands?.length) card.append(el("h4", {}, "확인 명령"), cmdBlock(p.commands));
    if (p.watch?.length) {
      card.append(el("h4", {}, "이 단계에서 자주 보이는 문제"));
      const chips = el("div", { class: "chips" });
      for (const id of p.watch) { const s = symptomOf(id); if (s) chips.append(el("a", { href: tsHash(id) }, s.title)); }
      card.append(chips);
    }
    if (p.rollback) card.append(el("h4", {}, "롤백"), el("p", { class: "rollback" }, linkify(p.rollback)));
    if (withSymptoms) {
      const list = ts.symptoms.filter((s) => s.phase === p.id);
      if (list.length) {
        card.append(el("h4", {}, "이 단계의 증상별 진단"));
        const cards = el("div", { class: "index-cards" });
        for (const s of list) cards.append(el("a", { href: tsHash(s.id) }, el("span", {}, s.title, el("small", {}, (s.signs || [])[0] || ""))));
        card.append(cards);
      }
    }
    return card;
  }

  function renderTsPage(id) {
    const body = $("ts-body");
    body.replaceChildren();
    if (!id || id === "roadmap") {
      body.append(el("h2", {}, "업그레이드 로드맵"),
        el("p", { class: "muted" }, "단계 순서대로 진행하면서, 문제가 생기면 해당 단계의 증상을 눌러 진단합니다."));
      const flow = el("div", { class: "flow" });
      ts.phases.forEach((p, i) => flow.append(el("a", { href: tsHash(`phase-${p.id}`) }, p.title), ...(i < ts.phases.length - 1 ? [el("span", {}, "→")] : [])));
      body.append(flow, ...ts.phases.map((p) => phaseCard(p, false)));
      return;
    }
    if (id.startsWith("phase-")) {
      const p = phaseOf(id.slice(6));
      if (p) { body.append(phaseCard(p, true)); return; }
    }
    const s = symptomOf(id);
    if (!s) { body.append(el("div", { class: "empty" }, "항목을 찾을 수 없습니다.")); return; }
    const p = phaseOf(s.phase);
    body.append(
      el("div", { class: "crumb" }, el("a", { href: tsHash(`phase-${p.id}`) }, p.title)),
      el("h2", {}, s.title),
      el("h4", {}, "① 이런 증상"), el("ul", {}, ...(s.signs || []).map((x) => el("li", {}, x))),
      el("h4", {}, "② 먼저 확인"), cmdBlock(s.first),
      el("h4", {}, "③ 원인별 분기"));
    s.causes.forEach((c, i) => {
      const card = el("div", { class: "cause" }, el("div", { class: "cause-title" }, `${i + 1}. ${c.title}`));
      if (c.signs) card.append(el("div", { class: "row" }, el("b", {}, "판단 근거"), el("span", {}, c.signs)));
      if (c.checks?.length) card.append(el("div", { class: "row" }, el("b", {}, "확인"), cmdBlock(c.checks)));
      card.append(el("div", { class: "row" }, el("b", {}, "조치"), el("span", {}, linkify(c.fix))));
      body.append(card);
    });
  }

  async function openTroubleshoot(id) {
    if (!ts) {
      try { ts = await (await fetch("/api/troubleshooting")).json(); }
      catch (e) { $("ts-body").replaceChildren(el("div", { class: "empty" }, `불러오지 못했습니다: ${e}`)); return; }
    }
    renderTsNav(id || "roadmap");
    renderTsPage(id || "roadmap");
  }
  $("ts-search").addEventListener("input", () => {
    if (!ts) return;
    const active = $("ts-nav").querySelector("a.active")?.dataset.id;
    renderTsNav(active);
  });

  // ===================== 기록 =====================
  async function reportList() {
    try { return (await (await fetch("/api/reports")).json()).reports || []; } catch (e) { return []; }
  }

  function describe(name) {
    const m = name.match(/^(\d{4})(\d{2})(\d{2})(?:-(\d{2})(\d{2})(\d{2}))?-(\d+\.\d+)-to-(\d+\.\d+)(?:-(.+))?\.md$/);
    if (!m) return { when: "-", path: "-", extra: "" };
    return { when: `${m[1]}-${m[2]}-${m[3]}` + (m[4] ? ` ${m[4]}:${m[5]}` : ""), path: `${m[7]} → ${m[8]}`, extra: m[9] || "" };
  }

  async function renderHistory() {
    const list = await reportList();
    const box = $("history-list");
    if (!list.length) { box.replaceChildren(el("div", { class: "empty" }, "저장된 리포트가 없습니다.")); return; }
    const tbody = el("tbody");
    for (const name of list) {
      const d = describe(name);
      const tr = el("tr", { class: "click", onclick: () => { location.hash = reportHash(name); } },
        el("td", {}, d.when), el("td", {}, d.path), el("td", {}, d.extra), el("td", {}, el("a", { href: reportHash(name) }, name)));
      tbody.append(tr);
    }
    box.replaceChildren(el("table", { class: "list" },
      el("thead", {}, el("tr", {}, el("th", {}, "생성 일시"), el("th", {}, "업그레이드 경로"), el("th", {}, "구분"), el("th", {}, "파일"))), tbody));
  }

  // ===================== 실행 =====================
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function poll(job) {
    for (;;) {
      const state = await (await fetch(`/api/jobs/${job}`)).json();
      $("log").textContent = state.logs.join("\n");
      $("log").scrollTop = $("log").scrollHeight;
      if (state.status === "done") return state;
      if (state.status === "error") throw new Error(state.error);
      await sleep(700);
    }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = $("form-error");
    const data = collect();
    const errors = validate(data);
    errBox.hidden = !errors.length;
    errBox.textContent = errors.join("\n");
    if (errors.length) return;
    save(data);

    const btn = $("run");
    btn.disabled = true; btn.textContent = "생성 중…";
    $("progress").hidden = false; $("spinner").hidden = false;
    $("progress-text").textContent = "리포트 생성 중… (수십 초 걸릴 수 있음)";
    $("log").textContent = "요청 중…";
    try {
      const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      const state = await poll(body.job);
      cache.set(state.report.name, buildPages(state.report));
      $("progress").hidden = true;
      location.hash = reportHash(state.report.name);
    } catch (err) {
      $("spinner").hidden = true;
      $("progress-text").textContent = "생성 실패";
      errBox.hidden = false;
      errBox.textContent = String(err.message || err);
    } finally {
      btn.disabled = false; btn.textContent = "리포트 생성";
    }
  });

  $("add-addon").addEventListener("click", () => addonRow());
  $("add-ng").addEventListener("click", () => ngRow({ ami_type: "AL2023_x86_64_STANDARD" }));

  // ===================== 초기화 =====================
  (async () => {
    const init = await (await fetch("/api/init")).json();
    components = init.components;
    amiTypes = init.ami_types || [];
    $("ver").textContent = `v${init.version}`;
    const badge = $("token-badge");
    badge.textContent = init.github_token ? "GitHub 토큰 사용" : "GitHub 토큰 없음 (시간당 60회 제한)";
    badge.classList.toggle("ok", init.github_token);
    fill(load() ?? init.env ?? {});
    if (init.env_error) { $("form-error").hidden = false; $("form-error").textContent = `env.yaml 을 읽지 못했습니다: ${init.env_error}`; }
    loadVersions();
    for (const id of ["aws-profile", "aws-region"]) $(id).addEventListener("change", loadVersions);
    $("cur").addEventListener("change", () => refreshClusterSelects($("cur").value, $("tgt").value));
    lastReportName = (init.reports || [])[0] || null;
    route();
  })().catch((err) => { $("form-error").hidden = false; $("form-error").textContent = `초기화 실패: ${err}`; route(); });
})();
</script>
</body>
</html>
