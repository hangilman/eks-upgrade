<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKS 업그레이드 사전 점검</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2127; --muted: #5f6b7a; --border: #dde1e6;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c62828; --warn-bg: #fff6e0; --warn-border: #f0c36d;
    --code-bg: #f0f2f5; --quote-bg: #f3f6fb; --quote-border: #9db6e8; --row-hover: #f5f8fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e3e6ea; --muted: #98a2b0; --border: #333a44;
      --accent: #5b8ff0; --accent-text: #0e1116; --danger: #ef6b6b; --warn-bg: #3a3020; --warn-border: #7a6230;
      --code-bg: #262b33; --quote-bg: #212835; --quote-border: #4d6aa3; --row-hover: #232a35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .ver { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
  .badge.ok { color: #2e7d32; border-color: #2e7d32; }
  main { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  form .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  @media (max-width: 960px) { form .panel { position: static; max-height: none; } }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row > * { min-width: 0; }
  input[type=text], select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                             background: var(--bg); color: var(--text); font: inherit; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.invalid { border-color: var(--danger); }
  .ver-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .ver-pair label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .arrow { padding-top: 16px; color: var(--muted); }
  .grid-addon { display: grid; grid-template-columns: 1.5fr 1.4fr 1fr 28px; gap: 6px; margin-bottom: 6px; }
  .grid-addon .custom { grid-column: 1 / 4; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid-ng { display: grid; grid-template-columns: 1fr 70px 1.4fr 28px; gap: 6px; margin-bottom: 6px; }
  .cols-head { font-size: 11px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 10px; }
  button:hover { background: var(--row-hover); }
  button.icon { padding: 0; width: 28px; height: 30px; color: var(--muted); }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 0; }
  button.primary { width: 100%; margin-top: 16px; padding: 10px; background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .6; cursor: progress; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .checks label { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .error { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px; padding: 8px 10px; margin-top: 10px; white-space: pre-wrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar select { width: auto; max-width: 320px; }
  .toolbar .spacer { flex: 1; }
  #log, #warnings { overflow-wrap: anywhere; }
  #warnings { margin: 0 0 16px; }
  #log { font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--code-bg); border-radius: 6px; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  /* report */
  #report { overflow-wrap: anywhere; }
  #report h1 { font-size: 20px; margin-top: 0; }
  #report h2 { font-size: 17px; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  #report h3 { font-size: 15px; margin: 22px 0 8px; }
  #report h4 { font-size: 14px; margin: 16px 0 6px; }
  #report ul { padding-left: 22px; margin: 6px 0; }
  #report li { margin: 3px 0; }
  #report li.task { list-style: none; margin-left: -20px; }
  #report code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  #report pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  #report pre code { background: none; padding: 0; }
  #report blockquote { margin: 10px 0; padding: 8px 12px; background: var(--quote-bg); border-left: 4px solid var(--quote-border); border-radius: 4px; }
  #report a { color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  #report table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  #report th, #report td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
  #report th { background: var(--code-bg); }
  #report tr:hover td { background: var(--row-hover); }
  @media print {
    header, form, .toolbar, #log { display: none !important; }
    main { display: block; padding: 0; }
    .panel { border: none; }
  }
</style>
</head>
<body>
<header>
  <h1>EKS 업그레이드 사전 점검</h1>
  <span class="ver" id="ver"></span>
  <span class="spacer"></span>
  <span class="badge" id="token-badge" title="GitHub API 호출 한도">GitHub 토큰 확인 중</span>
</header>

<main>
  <form id="form" autocomplete="off" novalidate>
    <div class="panel">
      <h2>1. 클러스터 버전</h2>
      <div class="ver-pair">
        <div><label for="cur">현재</label><input type="text" id="cur" placeholder="1.35" list="k8s-versions"></div>
        <div class="arrow">→</div>
        <div><label for="tgt">목표</label><input type="text" id="tgt" placeholder="1.36" list="k8s-versions"></div>
      </div>

      <h2>2. 사용 중인 add-on</h2>
      <p class="hint">입력한 add-on 만 분석합니다. 버전 확인: <code>aws eks describe-addon --cluster-name &lt;이름&gt; --addon-name vpc-cni</code></p>
      <div class="grid-addon cols-head"><span>이름</span><span>현재 버전</span><span>목표 (선택)</span><span></span></div>
      <div id="addons"></div>
      <button type="button" class="link" id="add-addon">+ add-on 추가</button>

      <h2>3. 노드그룹 (선택)</h2>
      <p class="hint">AMI 타입(AL2 지원 종료)과 kubelet 버전 차이를 점검합니다.</p>
      <div class="grid-ng cols-head"><span>이름</span><span>버전</span><span>AMI 타입</span><span></span></div>
      <div id="nodegroups"></div>
      <button type="button" class="link" id="add-ng">+ 노드그룹 추가</button>

      <details id="opts">
        <summary>옵션</summary>
        <div class="checks">
          <label><input type="checkbox" id="opt-issues" checked> GitHub 관련 이슈 검색 (느릴 수 있음)</label>
          <label><input type="checkbox" id="opt-aws" checked> AWS CLI 로 EKS 지원 버전 확인 (읽기 전용)</label>
          <label><input type="checkbox" id="opt-cache" checked> 캐시 사용 (6시간)</label>
        </div>
        <div class="ver-pair" style="grid-template-columns: 1fr 1fr;">
          <div><label for="aws-profile">AWS profile</label><input type="text" id="aws-profile" placeholder="기본값"></div>
          <div><label for="aws-region">AWS region</label><input type="text" id="aws-region" placeholder="기본값"></div>
        </div>
      </details>

      <button type="submit" class="primary" id="run">리포트 생성</button>
      <div id="form-error" class="error" hidden></div>
    </div>
  </form>

  <section class="panel">
    <div class="toolbar">
      <select id="history" aria-label="이전 리포트"><option value="">이전 리포트 보기…</option></select>
      <span class="spacer"></span>
      <button type="button" id="download" disabled>Markdown 다운로드</button>
      <button type="button" id="print" disabled>인쇄 / PDF</button>
    </div>
    <div id="log" hidden></div>
    <div id="warnings" class="error" hidden></div>
    <article id="report"><div class="empty">왼쪽에 버전을 입력하고 <b>리포트 생성</b>을 누르세요.</div></article>
  </section>
</main>

<datalist id="k8s-versions"></datalist>
<datalist id="ami-types">
  <option value="AL2023_x86_64_STANDARD"><option value="AL2023_ARM_64_STANDARD">
  <option value="AL2023_x86_64_NVIDIA"><option value="AL2023_x86_64_NEURON">
  <option value="BOTTLEROCKET_x86_64"><option value="BOTTLEROCKET_ARM_64">
  <option value="AL2_x86_64"><option value="AL2_ARM_64"><option value="AL2_x86_64_GPU">
  <option value="WINDOWS_CORE_2022_x86_64"><option value="WINDOWS_FULL_2022_x86_64">
</datalist>

<script>
(() => {
  const STORE_KEY = "eks-precheck:input";
  const CUSTOM = "__custom__";
  const $ = (id) => document.getElementById(id);
  let components = {};
  let current = null; // {name, markdown}

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) node.setAttribute(k, v);
    }
    for (const c of children) node.append(c);
    return node;
  };
  const input = (cls, value, placeholder, list) =>
    el("input", { type: "text", class: cls, value: value ?? "", placeholder, list });

  for (let m = 25; m <= 40; m++) $("k8s-versions").append(el("option", { value: `1.${m}` }));

  // ---- add-on rows ----
  function addonRow(data = {}) {
    const known = data.name && components[data.name];
    const sel = el("select", { class: "a-name", "aria-label": "add-on 이름" });
    sel.append(el("option", { value: "" }, "선택…"));
    for (const name of Object.keys(components)) sel.append(el("option", { value: name }, name));
    sel.append(el("option", { value: CUSTOM }, "기타 (직접 입력)"));
    sel.value = data.name ? (known ? data.name : CUSTOM) : "";

    const custom = el("div", { class: "custom" },
      input("a-custom-name", known ? "" : data.name, "이름 (예: cert-manager)"),
      input("a-repo", data.repo, "GitHub repo (owner/name)"));
    custom.hidden = sel.value !== CUSTOM;
    sel.addEventListener("change", () => { custom.hidden = sel.value !== CUSTOM; });

    const row = el("div", { class: "grid-addon" },
      sel, input("a-cur", data.current, "v1.18.3-eksbuild.1"), input("a-tgt", data.target, "최신"),
      el("button", { type: "button", class: "icon", title: "삭제", onclick: () => row.remove() }, "✕"),
      custom);
    $("addons").append(row);
  }

  function ngRow(data = {}) {
    const row = el("div", { class: "grid-ng" },
      input("n-name", data.name, "app"), input("n-ver", data.version, "1.35", "k8s-versions"),
      input("n-ami", data.ami_type, "AL2023_x86_64_STANDARD", "ami-types"),
      el("button", { type: "button", class: "icon", title: "삭제", onclick: () => row.remove() }, "✕"));
    $("nodegroups").append(row);
  }

  // ---- form <-> data ----
  function collect() {
    const data = { cluster: { current: $("cur").value.trim(), target: $("tgt").value.trim() }, addons: {}, nodegroups: [] };
    for (const row of $("addons").children) {
      let name = row.querySelector(".a-name").value;
      const cur = row.querySelector(".a-cur").value.trim();
      const tgt = row.querySelector(".a-tgt").value.trim();
      const entry = { current: cur, target: tgt };
      if (name === CUSTOM) {
        name = row.querySelector(".a-custom-name").value.trim();
        entry.repo = row.querySelector(".a-repo").value.trim();
      }
      if (name) data.addons[name] = entry;
    }
    for (const row of $("nodegroups").children) {
      const ng = { name: row.querySelector(".n-name").value.trim(), version: row.querySelector(".n-ver").value.trim(),
                   ami_type: row.querySelector(".n-ami").value.trim() };
      if (ng.name || ng.version || ng.ami_type) data.nodegroups.push(ng);
    }
    const profile = $("aws-profile").value.trim(), region = $("aws-region").value.trim();
    if (profile || region) data.aws = { profile, region };
    data.options = { no_issues: !$("opt-issues").checked, no_aws: !$("opt-aws").checked, no_cache: !$("opt-cache").checked };
    return data;
  }

  function fill(data) {
    $("cur").value = data?.cluster?.current ?? "";
    $("tgt").value = data?.cluster?.target ?? "";
    $("addons").replaceChildren();
    $("nodegroups").replaceChildren();
    const addons = data?.addons ?? {};
    for (const [name, v] of Object.entries(addons)) {
      const entry = (v && typeof v === "object") ? v : { current: v };
      addonRow({ name, current: entry.current, target: entry.target, repo: entry.repo });
    }
    if (!Object.keys(addons).length) ["vpc-cni", "coredns", "kube-proxy"].forEach((name) => addonRow({ name }));
    for (const ng of data?.nodegroups ?? []) ngRow(ng);
    $("aws-profile").value = data?.aws?.profile ?? "";
    $("aws-region").value = data?.aws?.region ?? "";
    const o = data?.options ?? {};
    $("opt-issues").checked = !o.no_issues; $("opt-aws").checked = !o.no_aws; $("opt-cache").checked = !o.no_cache;
  }

  function validate(data) {
    const errors = [];
    const ver = /^v?\d+\.\d+$/;
    for (const [id, label] of [["cur", "현재 버전"], ["tgt", "목표 버전"]]) {
      const ok = ver.test($(id).value.trim());
      $(id).classList.toggle("invalid", !ok);
      if (!ok) errors.push(`${label}을(를) 1.35 형식으로 입력하세요.`);
    }
    for (const row of $("addons").children) {
      const named = row.querySelector(".a-name").value;
      const cur = row.querySelector(".a-cur");
      const bad = named && !cur.value.trim();
      cur.classList.toggle("invalid", !!bad);
      if (bad) errors.push(`add-on 의 현재 버전이 비어 있습니다.`);
    }
    return [...new Set(errors)];
  }

  const save = (data) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; } };

  // ---- report view ----
  function showReport(rep, warnings = []) {
    current = rep;
    const article = $("report");
    article.innerHTML = rep.html; // 서버에서 escape 된 HTML (md_render)
    $("download").disabled = false;
    $("print").disabled = false;
    const w = $("warnings");
    w.hidden = !warnings.length;
    w.textContent = warnings.length ? "수집 경고\n- " + warnings.join("\n- ") : "";
  }

  async function refreshHistory(selected) {
    const res = await fetch("/api/reports");
    const { reports } = await res.json();
    const sel = $("history");
    sel.replaceChildren(el("option", { value: "" }, "이전 리포트 보기…"));
    for (const name of reports) sel.append(el("option", { value: name }, name));
    if (selected) sel.value = selected;
  }

  $("history").addEventListener("change", async (e) => {
    if (!e.target.value) return;
    const res = await fetch(`/api/reports/${encodeURIComponent(e.target.value)}`);
    if (res.ok) { $("log").hidden = true; showReport(await res.json()); }
  });

  $("download").addEventListener("click", () => {
    if (!current) return;
    const blob = new Blob([current.markdown], { type: "text/markdown;charset=utf-8" });
    const a = el("a", { href: URL.createObjectURL(blob), download: current.name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("print").addEventListener("click", () => window.print());

  // ---- run ----
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function poll(job) {
    const log = $("log");
    for (;;) {
      const res = await fetch(`/api/jobs/${job}`);
      const state = await res.json();
      log.textContent = state.logs.join("\n");
      log.scrollTop = log.scrollHeight;
      if (state.status === "done") return state;
      if (state.status === "error") throw new Error(state.error);
      await sleep(700);
    }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = $("form-error");
    const data = collect();
    const errors = validate(data);
    errBox.hidden = !errors.length;
    errBox.textContent = errors.join("\n");
    if (errors.length) return;
    save(data);

    const btn = $("run");
    btn.disabled = true; btn.textContent = "생성 중… (수십 초 걸릴 수 있음)";
    $("log").hidden = false; $("log").textContent = "요청 중…";
    $("warnings").hidden = true;
    try {
      const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      const state = await poll(body.job);
      showReport(state.report, state.warnings);
      await refreshHistory(state.report.name);
    } catch (err) {
      errBox.hidden = false;
      errBox.textContent = String(err.message || err);
    } finally {
      btn.disabled = false; btn.textContent = "리포트 생성";
    }
  });

  $("add-addon").addEventListener("click", () => addonRow());
  $("add-ng").addEventListener("click", () => ngRow());

  // ---- init ----
  (async () => {
    const res = await fetch("/api/init");
    const init = await res.json();
    components = init.components;
    $("ver").textContent = `v${init.version}`;
    const badge = $("token-badge");
    badge.textContent = init.github_token ? "GitHub 토큰 사용" : "GitHub 토큰 없음 (시간당 60회 제한)";
    badge.classList.toggle("ok", init.github_token);
    fill(load() ?? init.env ?? {});
    if (init.env_error) { $("form-error").hidden = false; $("form-error").textContent = `env.yaml 을 읽지 못했습니다: ${init.env_error}`; }
    await refreshHistory();
  })().catch((err) => { $("form-error").hidden = false; $("form-error").textContent = `초기화 실패: ${err}`; });
})();
</script>
</body>
</html>
