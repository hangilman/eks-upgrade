# eks-precheck 입력 파일
# 아래 값을 내 환경에 맞게 고친 뒤 실행:  eks-precheck run env.yaml
# 버전은 반드시 따옴표로 감싸세요 ("1.30" 을 따옴표 없이 쓰면 YAML 이 1.3 으로 읽습니다).

cluster:
  current: "1.31"   # 현재 EKS(Kubernetes) 버전
  target: "1.33"    # 목표 버전

# 사용 중인 add-on / 컨트롤러와 현재 버전. 여기 적은 것만 분석합니다.
# 기본 지원: vpc-cni, coredns, kube-proxy, ebs-csi, aws-load-balancer-controller, karpenter
# 버전 확인:  aws eks list-addons --cluster-name <이름>
#            aws eks describe-addon --cluster-name <이름> --addon-name vpc-cni --query addon.addonVersion
addons:
  vpc-cni: "v1.18.3-eksbuild.1"
  coredns: "v1.11.1-eksbuild.9"
  kube-proxy: "v1.31.0-eksbuild.2"

  # 목표 버전을 정해 두었다면 current / target 으로 적습니다. (target 생략 시 최신 릴리스)
  # aws-load-balancer-controller:
  #   current: "v2.8.1"
  #   target: "v2.11.0"

  # 기본 목록에 없는 컴포넌트는 GitHub 레포를 함께 적습니다.
  # cert-manager:
  #   current: "v1.14.4"
  #   repo: cert-manager/cert-manager

# (선택) AWS CLI 설정. AWS CLI 가 로그인되어 있으면 `aws eks describe-cluster-versions`(읽기 전용)로
# EKS 가 실제 지원하는 버전을 확인합니다. 기본 profile/region 을 쓰면 생략 가능.
# aws:
#   profile: default
#   region: ap-northeast-2

# (선택) 노드그룹 정보. 적으면 AMI 타입(AL2 지원 종료)과 kubelet 버전 차이(skew)를 점검합니다.
# 확인:  aws eks describe-nodegroup --cluster-name <이름> --nodegroup-name <ng> --query "nodegroup.[version,amiType]"
nodegroups:
  # - name: app
  #   version: "1.31"
  #   ami_type: AL2_x86_64
