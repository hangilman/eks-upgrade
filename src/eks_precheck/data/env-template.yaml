# eks-precheck 입력 파일
# 아래 값을 내 환경에 맞게 고친 뒤 실행:  eks-precheck run env.yaml
# 버전은 반드시 따옴표로 감싸세요 ("1.30" 을 따옴표 없이 쓰면 YAML 이 1.3 으로 읽습니다).

cluster:
  current: "1.31"   # 현재 EKS(Kubernetes) 버전
  target: "1.33"    # 목표 버전

# 사용 중인 add-on / 컨트롤러와 현재 버전. 여기 적은 것만 분석합니다.
# EKS 관리형 add-on 가능: vpc-cni, coredns, kube-proxy, ebs-csi, efs-csi, eks-pod-identity-agent
# Helm / 직접 설치: aws-load-balancer-controller, karpenter, cluster-autoscaler, metrics-server, cert-manager,
#                  external-dns, external-secrets, ingress-nginx, argo-cd, istio, aws-node-termination-handler, velero
# install 을 생략하면 EKS 관리형 add-on 이 가능한 것은 eks-addon, 나머지는 helm 으로 봅니다.
# Helm 설치는 `helm list -A` 의 APP VERSION 을 적습니다 (CHART 버전과 다를 수 있음).
# 버전 확인:  aws eks list-addons --cluster-name <이름>
#            aws eks describe-addon --cluster-name <이름> --addon-name vpc-cni --query addon.addonVersion
addons:
  vpc-cni: "v1.18.3-eksbuild.1"
  coredns: "v1.11.1-eksbuild.9"
  kube-proxy: "v1.31.0-eksbuild.2"

  # 목표 버전을 정해 두었다면 current / target 으로 적습니다. (target 생략 시 최신 릴리스)
  # aws-load-balancer-controller:
  #   current: "v2.8.1"
  #   target: "v2.11.0"

  # EKS 관리형 add-on 이 가능한 컴포넌트를 Helm 으로 설치했다면 install: helm
  # coredns:
  #   current: "1.11.3"
  #   install: helm

  # 기본 목록에 없는 컴포넌트는 GitHub 레포를 함께 적습니다.
  # cert-manager:
  #   current: "v1.14.4"
  #   repo: cert-manager/cert-manager

# (선택) AWS CLI 설정. AWS CLI 가 로그인되어 있으면 `aws eks describe-cluster-versions`(읽기 전용)로
# EKS 가 실제 지원하는 버전을 확인합니다. 기본 profile/region 을 쓰면 생략 가능.
# aws:
#   profile: default
#   region: ap-northeast-2

# (선택) 노드그룹 정보. 적으면 AMI 타입(AL2 지원 종료)과 kubelet 버전 차이(skew)를 점검하고,
# AWS CLI 가 있으면 현재/목표 버전의 권장 EKS 최적화 AMI ID 를 SSM 공개 파라미터로 조회합니다.
# ami_id 는 Launch Template 에 지정한 현재 AMI 로, 적으면 권장 AMI 와 비교합니다 (선택).
# 확인:  aws eks describe-nodegroup --cluster-name <이름> --nodegroup-name <ng> --query "nodegroup.[version,amiType]"
nodegroups:
  # - name: app
  #   version: "1.31"
  #   ami_type: AL2023_x86_64_STANDARD
  #   ami_id: ami-0123456789abcdef0
