[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eks-precheck"
version = "0.1.0"
description = "EKS 업그레이드 전 변경사항/이슈 사전 점검 리포트 생성 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
cluster = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
eks-precheck = "eks_precheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eks_precheck = ["data/*.yaml", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
